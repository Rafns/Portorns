<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#090B0E"/>
    </radialGradient>
    <filter id="phoneShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGlow)"/>

  <!-- Subtle Ambient Glow Behind Result Phone -->
  <circle cx="850" cy="340" r="280" fill="#007AFF" opacity="0.1" filter="blur(60px)"/>
  <circle cx="350" cy="340" r="260" fill="#3B82F6" opacity="0.08" filter="blur(60px)"/>

  <!-- ==================== LEFT PHONE: WELCOME ONBOARDING ==================== -->
  <g transform="translate(110, 65) scale(0.60)" filter="url(#phoneShadow)">
    <!-- Phone Outer Shell -->
    <rect width="450" height="900" rx="46" fill="#1C1C1E" stroke="#3A3A3C" stroke-width="4"/>
    <rect x="8" y="8" width="434" height="884" rx="40" fill="#000000"/>
    
    <!-- Circles Background -->
    <circle cx="225" cy="180" r="140" fill="none" stroke="#27272A" stroke-width="2"/>
    <circle cx="225" cy="180" r="240" fill="none" stroke="#27272A" stroke-width="2"/>

    <!-- Text & UI -->
    <g transform="translate(36, 60)">
      <text x="0" y="45" font-family="-apple-system, sans-serif" font-size="40" font-weight="800" fill="#FFFFFF">DermaScan</text>
      <text x="0" y="90" font-family="-apple-system, sans-serif" font-size="19" fill="#A1A1AA">AI-assisted skin screening,</text>
      <text x="0" y="118" font-family="-apple-system, sans-serif" font-size="19" fill="#A1A1AA">designed to be calm, fast,</text>
      <text x="0" y="146" font-family="-apple-system, sans-serif" font-size="19" fill="#A1A1AA">and medically responsible.</text>

      <!-- Features -->
      <g transform="translate(0, 195)">
        <text x="44" y="16" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">📷 Capture or upload</text>
        <text x="44" y="40" font-family="-apple-system, sans-serif" font-size="13" fill="#8E8E93">Frame skin area clearly in bright light</text>
      </g>
      <g transform="translate(0, 280)">
        <text x="44" y="16" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">✨ Screen visual patterns</text>
        <text x="44" y="40" font-family="-apple-system, sans-serif" font-size="13" fill="#8E8E93">Model suggests category with confidence</text>
      </g>
      <g transform="translate(0, 365)">
        <text x="44" y="16" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">💙 Learn what to do next</text>
        <text x="44" y="40" font-family="-apple-system, sans-serif" font-size="13" fill="#8E8E93">Read plain-language medical guidance</text>
      </g>

      <rect y="470" width="362" height="85" rx="14" fill="#1C1C1E"/>
      <text x="18" y="505" font-family="-apple-system, sans-serif" font-size="12" fill="#8E8E93">DermaScan is an informational screening assistant.</text>

      <rect y="600" width="362" height="52" rx="26" fill="#007AFF"/>
      <text x="181" y="632" font-family="-apple-system, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Get Started</text>
    </g>
  </g>

  <!-- ==================== CENTER PHONE: LIVE CAMERA SCAN ==================== -->
  <g transform="translate(465, 45) scale(0.64)" filter="url(#phoneShadow)">
    <rect width="450" height="900" rx="46" fill="#1C1C1E" stroke="#3A3A3C" stroke-width="4"/>
    <rect x="8" y="8" width="434" height="884" rx="40" fill="#71717A"/>
    
    <!-- Viewfinder Screen -->
    <rect x="8" y="8" width="434" height="740" rx="40" fill="#8E959B"/>
    <text x="40" y="42" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">20.58</text>
    <text x="40" y="80" font-family="-apple-system, sans-serif" font-size="24" fill="#FFFFFF">✕</text>

    <!-- Center brackets -->
    <g transform="translate(48, 240)">
      <rect width="338" height="300" rx="16" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4"/>
      <path d="M 0 28 L 0 16 C 0 7.2 7.2 0 16 0 L 28 0" fill="none" stroke="#FFFFFF" stroke-width="4.5"/>
      <path d="M 310 0 L 322 0 C 330.8 0 338 7.2 338 16 L 338 28" fill="none" stroke="#FFFFFF" stroke-width="4.5"/>
      <path d="M 0 272 L 0 284 C 0 292.8 7.2 300 16 300 L 28 300" fill="none" stroke="#FFFFFF" stroke-width="4.5"/>
      <path d="M 310 300 L 322 300 C 330.8 300 338 292.8 338 284 L 338 272" fill="none" stroke="#FFFFFF" stroke-width="4.5"/>
    </g>

    <!-- Bottom Bar -->
    <rect x="8" y="748" width="434" height="144" fill="#000000"/>
    <circle cx="85" cy="820" r="28" fill="#27272A"/>
    <rect x="155" y="792" width="160" height="56" rx="28" fill="#007AFF"/>
    <text x="235" y="827" font-family="-apple-system, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Capture</text>
  </g>

  <!-- ==================== RIGHT PHONE: AI RESULT ==================== -->
  <g transform="translate(820, 65) scale(0.60)" filter="url(#phoneShadow)">
    <rect width="450" height="900" rx="46" fill="#1C1C1E" stroke="#3A3A3C" stroke-width="4"/>
    <rect x="8" y="8" width="434" height="884" rx="40" fill="#FFFFFF"/>

    <!-- Status Bar -->
    <text x="40" y="38" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#000000">10.00</text>
    <rect x="165" y="18" width="120" height="28" rx="14" fill="#000000"/>
    
    <text x="225" y="85" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">Result</text>

    <!-- Lesion Image -->
    <g transform="translate(25, 105)">
      <rect width="400" height="250" rx="20" fill="#CE8B60"/>
      <ellipse cx="200" cy="125" rx="140" ry="85" fill="#4A2518"/>
      <circle cx="160" cy="115" r="50" fill="#241009"/>
      <circle cx="230" cy="135" r="40" fill="#3D1C12"/>
    </g>

    <!-- Result Card -->
    <g transform="translate(25, 385)">
      <rect width="400" height="470" rx="22" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <g transform="translate(24, 25)">
        <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="13" fill="#6B7280">AI screening result suggests match</text>
        <text x="0" y="55" font-family="-apple-system, sans-serif" font-size="34" font-weight="800" fill="#111827">Malignant</text>

        <!-- Grid Confidence & Urgency -->
        <g transform="translate(0, 80)">
          <rect width="168" height="70" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
          <text x="14" y="26" font-family="-apple-system, sans-serif" font-size="12" fill="#6B7280">Confidence</text>
          <text x="14" y="52" font-family="-apple-system, sans-serif" font-size="19" font-weight="700" fill="#111827">95.4%</text>

          <g transform="translate(184, 0)">
            <rect width="168" height="70" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
            <text x="14" y="26" font-family="-apple-system, sans-serif" font-size="12" fill="#6B7280">Urgency</text>
            <text x="14" y="52" font-family="-apple-system, sans-serif" font-size="19" font-weight="700" fill="#DC2626">High</text>
          </g>
        </g>

        <!-- Desc -->
        <g transform="translate(0, 185)">
          <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="14" fill="#374151">Model suggests possible match with</text>
          <text x="0" y="22" font-family="-apple-system, sans-serif" font-size="14" fill="#374151">malignant lesion (e.g. melanoma).</text>
          <text x="0" y="44" font-family="-apple-system, sans-serif" font-size="14" fill="#374151">Requires professional evaluation.</text>
        </g>

        <!-- Alert Box -->
        <g transform="translate(0, 275)">
          <rect width="352" height="75" rx="14" fill="#FEF2F2" stroke="#FEE2E2"/>
          <text x="16" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#1F2937">Please consult a certified</text>
          <text x="16" y="54" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#1F2937">dermatologist for examination.</text>
        </g>
      </g>
    </g>
  </g>
</svg>
