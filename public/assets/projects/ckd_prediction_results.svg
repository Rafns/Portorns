<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <style>
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 800; fill: #1A202C; letter-spacing: 0.5px; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #FFFFFF; letter-spacing: 1px; }
      .negative-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 32px; font-weight: 900; fill: #FFFFFF; letter-spacing: 2px; }
      .prob-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #F0FDF4; }
      .param-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 500; fill: #E2F1E8; }
      .edukasi-item { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #E8F5E9; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="520" rx="12" fill="#F4F7F5"/>

  <!-- ==================== HEADER 1: HASIL PREDIKSI ==================== -->
  <text x="35" y="44" class="header-title">🎯 HASIL PREDIKSI</text>

  <!-- Big Result Card (Sage Green) -->
  <rect x="25" y="60" width="1150" height="175" rx="14" fill="#588168"/>

  <!-- Badge: RISIKO CKD RENDAH -->
  <rect x="525" y="78" width="150" height="24" rx="4" fill="#43A047"/>
  <text x="600" y="94" class="badge-text" text-anchor="middle">✔ RISIKO CKD RENDAH</text>

  <!-- Main Negative Title -->
  <text x="600" y="140" class="negative-title" text-anchor="middle">NEGATIVE</text>

  <!-- Probabilitas Sehat -->
  <text x="600" y="172" class="prob-text" text-anchor="middle">Probabilitas Sehat: 86.1%</text>

  <!-- Param Desc -->
  <text x="600" y="200" class="param-desc" text-anchor="middle">💚 Parameter klinis pasien dalam batas normal. Tetap pertahankan gaya hidup sehat &amp; skrining rutin.</text>

  <!-- ==================== HEADER 2: EDUKASI PREVENTIF ==================== -->
  <text x="35" y="278" class="header-title">💡 EDUKASI PREVENTIF</text>

  <!-- Edukasi Preventif Card (Sage Green) -->
  <rect x="25" y="295" width="1150" height="195" rx="14" fill="#588168"/>

  <!-- List Items -->
  <text x="55" y="332" class="edukasi-item">• 💧 Jaga hidrasi: minum 1.5–2L air/hari</text>
  <text x="55" y="358" class="edukasi-item">• 🍲 Diet seimbang: kurangi garam &amp; processed food</text>
  <text x="55" y="384" class="edukasi-item">• 🏃 Aktivitas fisik: 30 menit/hari, 5×/minggu</text>
  <text x="55" y="410" class="edukasi-item">• 🚭 Hindari rokok &amp; batasi alkohol</text>
  <text x="55" y="436" class="edukasi-item">• 🩺 Skrining tahunan: cek kreatinin &amp; urin rutin</text>
  <text x="55" y="462" class="edukasi-item">• 💊 Gunakan obat sesuai resep</text>
</svg>
