<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 900" width="100%" height="100%">
  <defs>
    <style>
      .top-time { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #FFFFFF; }
      .btn-capture { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 600; fill: #FFFFFF; }
    </style>
  </defs>

  <!-- Viewport Background (Camera Feed Texture) -->
  <rect width="450" height="760" fill="#9DA3A8"/>
  <rect width="450" height="760" fill="url(#lensGrad)"/>
  
  <defs>
    <radialGradient id="lensGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#C5CBD0" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#8C9398" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#555C62" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- Top Status Elements -->
  <text x="35" y="38" class="top-time">20.58</text>
  <rect x="385" y="26" width="22" height="12" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="387" y="28" width="12" height="8" rx="1.5" fill="#FFFFFF"/>
  <text x="355" y="36" font-family="sans-serif" font-size="11" fill="#FFFFFF">4G</text>

  <!-- Close Button X -->
  <g transform="translate(35, 65)">
    <path d="M 6 6 L 22 22 M 22 6 L 6 22" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Viewfinder Frame (Target Area) -->
  <g transform="translate(45, 270)">
    <!-- Thin bounding box -->
    <rect width="360" height="320" rx="16" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.5"/>
    
    <!-- Bold White Corner Brackets -->
    <!-- Top-Left -->
    <path d="M 0 28 L 0 16 C 0 7.2 7.2 0 16 0 L 28 0" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Top-Right -->
    <path d="M 332 0 L 344 0 C 352.8 0 360 7.2 360 16 L 360 28" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Bottom-Left -->
    <path d="M 0 292 L 0 304 C 0 312.8 7.2 320 16 320 L 28 320" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Bottom-Right -->
    <path d="M 332 320 L 344 320 C 352.8 320 360 312.8 360 304 L 360 292" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Bottom Camera Control Bar -->
  <rect y="760" width="450" height="140" fill="#000000"/>

  <g transform="translate(0, 800)">
    <!-- Gallery Icon Circular Button -->
    <g transform="translate(60, 0)">
      <circle cx="28" cy="28" r="28" fill="#27272A" stroke="#3F3F46" stroke-width="1.5"/>
      <!-- Gallery photos icon -->
      <rect x="18" y="18" width="16" height="14" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
      <rect x="22" y="22" width="16" height="14" rx="2" fill="#3F3F46" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="26" cy="26" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Blue Capture Button -->
    <g transform="translate(150, 0)">
      <rect width="165" height="56" rx="28" fill="#007AFF"/>
      <text x="82.5" y="35" class="btn-capture" text-anchor="middle">Capture</text>
    </g>
  </g>
</svg>
