<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <radialGradient id="hudGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="60%" stop-color="#070B12"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <radialGradient id="camHeatmap" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.65"/>
      <stop offset="75%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background HUD -->
  <rect width="1200" height="675" fill="url(#hudGlow)"/>

  <!-- Grid overlay -->
  <g stroke="#1E293B" stroke-width="0.75" stroke-dasharray="4 8" opacity="0.4">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="200" y1="0" x2="200" y2="675"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
    <line x1="1000" y1="0" x2="1000" y2="675"/>
  </g>

  <!-- Top Status Bar -->
  <g transform="translate(60, 40)">
    <rect width="1080" height="48" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <circle cx="28" cy="24" r="6" fill="#10B981"/>
    <text x="44" y="29" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">DRIVER MONITORING SYSTEM (DMS)</text>
    <rect x="360" y="14" width="130" height="22" rx="4" fill="#1E293B"/>
    <text x="425" y="29" font-family="-apple-system, monospace" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">MobileNetV2 + Grad-CAM</text>
    <rect x="505" y="14" width="150" height="22" rx="4" fill="#1E293B"/>
    <text x="580" y="29" font-family="-apple-system, monospace" font-size="11" font-weight="600" fill="#A855F7" text-anchor="middle">MediaPipe vs dlib Setup</text>
    <text x="1050" y="29" font-family="-apple-system, monospace" font-size="13" font-weight="700" fill="#10B981" text-anchor="end">FPS: 58.4 | LATENCY: 17.1ms</text>
  </g>

  <!-- Main Viewfinder Feed: Center Screen -->
  <g transform="translate(60, 110)">
    <!-- Video Container -->
    <rect width="680" height="490" rx="14" fill="#0A0F1D" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Head / Face Silhouette Contour -->
    <g transform="translate(180, 50)">
      <!-- Head contour -->
      <path d="M 160 30 C 90 30 50 80 50 160 C 50 240 70 300 110 350 C 130 375 190 375 210 350 C 250 300 270 240 270 160 C 270 80 230 30 160 30 Z" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
      
      <!-- MediaPipe Face Mesh wireframe lines -->
      <g stroke="#0EA5E9" stroke-width="1" opacity="0.4">
        <line x1="160" y1="30" x2="160" y2="350"/>
        <line x1="80" y1="140" x2="240" y2="140"/>
        <line x1="90" y1="180" x2="230" y2="180"/>
        <line x1="100" y1="240" x2="220" y2="240"/>
        <line x1="110" y1="290" x2="210" y2="290"/>
      </g>

      <!-- Eyes with Grad-CAM Activation Heatmaps -->
      <!-- Left Eye -->
      <circle cx="115" cy="145" r="45" fill="url(#camHeatmap)"/>
      <ellipse cx="115" cy="145" rx="24" ry="7" fill="none" stroke="#EF4444" stroke-width="2"/>
      <circle cx="115" cy="145" r="4" fill="#EF4444"/>
      <!-- Landmark points -->
      <circle cx="92" cy="145" r="2.5" fill="#38BDF8"/>
      <circle cx="138" cy="145" r="2.5" fill="#38BDF8"/>
      <circle cx="115" cy="138" r="2.5" fill="#38BDF8"/>
      <circle cx="115" cy="152" r="2.5" fill="#38BDF8"/>

      <!-- Right Eye -->
      <circle cx="205" cy="145" r="45" fill="url(#camHeatmap)"/>
      <ellipse cx="205" cy="145" rx="24" ry="7" fill="none" stroke="#EF4444" stroke-width="2"/>
      <circle cx="205" cy="145" r="4" fill="#EF4444"/>
      <!-- Landmark points -->
      <circle cx="182" cy="145" r="2.5" fill="#38BDF8"/>
      <circle cx="228" cy="145" r="2.5" fill="#38BDF8"/>
      <circle cx="205" cy="138" r="2.5" fill="#38BDF8"/>
      <circle cx="205" cy="152" r="2.5" fill="#38BDF8"/>

      <!-- Nose Bridge & Tip -->
      <path d="M 160 135 L 155 200 L 165 210 L 160 215" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.7"/>

      <!-- Mouth (Yawning Detection) -->
      <ellipse cx="160" cy="285" rx="34" ry="24" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
      <!-- MAR mesh landmarks -->
      <circle cx="126" cy="285" r="2.5" fill="#F59E0B"/>
      <circle cx="194" cy="285" r="2.5" fill="#F59E0B"/>
      <circle cx="160" cy="261" r="2.5" fill="#F59E0B"/>
      <circle cx="160" cy="309" r="2.5" fill="#F59E0B"/>

      <!-- Bounding Box Corners -->
      <path d="M 30 50 L 30 15 L 65 15" fill="none" stroke="#EF4444" stroke-width="3"/>
      <path d="M 290 50 L 290 15 L 255 15" fill="none" stroke="#EF4444" stroke-width="3"/>
      <path d="M 30 330 L 30 365 L 65 365" fill="none" stroke="#EF4444" stroke-width="3"/>
      <path d="M 290 330 L 290 365 L 255 365" fill="none" stroke="#EF4444" stroke-width="3"/>
    </g>

    <!-- Overlay Alert Banner at Bottom of Video -->
    <rect x="20" y="420" width="640" height="50" rx="8" fill="url(#alertGrad)"/>
    <text x="45" y="451" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">⚠️ DROWSINESS DETECTED</text>
    <text x="640" y="451" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="end">AUDIO-VISUAL WARNING TRIGGERED</text>
  </g>

  <!-- Right Telemetry Panel -->
  <g transform="translate(765, 110)">
    <!-- Panel 1: EAR Metrics -->
    <rect width="375" height="150" rx="12" fill="#0A0F1D" stroke="#1E293B" stroke-width="1.5"/>
    <text x="24" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#94A3B8">EYE ASPECT RATIO (EAR)</text>
    <text x="350" y="32" font-family="-apple-system, monospace" font-size="14" font-weight="800" fill="#EF4444" text-anchor="end">0.178</text>
    <text x="24" y="55" font-family="-apple-system, sans-serif" font-size="11" fill="#64748B">Threshold: &lt; 0.22 (Closed Eye Warning)</text>
    
    <!-- Progress Bar -->
    <rect x="24" y="70" width="327" height="10" rx="5" fill="#1E293B"/>
    <rect x="24" y="70" width="110" height="10" rx="5" fill="#EF4444"/>
    <line x1="160" y1="65" x2="160" y2="85" stroke="#F59E0B" stroke-width="2"/>
    <text x="160" y="100" font-family="-apple-system, sans-serif" font-size="10" fill="#F59E0B" text-anchor="middle">Limit: 0.22</text>
    <text x="24" y="130" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#F87171">Status: Prolonged Eyelid Closure (18 Consecutive Frames)</text>

    <!-- Panel 2: MAR Metrics -->
    <g transform="translate(0, 168)">
      <rect width="375" height="150" rx="12" fill="#0A0F1D" stroke="#1E293B" stroke-width="1.5"/>
      <text x="24" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#94A3B8">MOUTH ASPECT RATIO (MAR)</text>
      <text x="350" y="32" font-family="-apple-system, monospace" font-size="14" font-weight="800" fill="#F59E0B" text-anchor="end">0.684</text>
      <text x="24" y="55" font-family="-apple-system, sans-serif" font-size="11" fill="#64748B">Threshold: &gt; 0.55 (Yawning Detection)</text>
      
      <!-- Progress Bar -->
      <rect x="24" y="70" width="327" height="10" rx="5" fill="#1E293B"/>
      <rect x="24" y="70" width="245" height="10" rx="5" fill="#F59E0B"/>
      <line x1="205" y1="65" x2="205" y2="85" stroke="#F59E0B" stroke-width="2"/>
      <text x="205" y="100" font-family="-apple-system, sans-serif" font-size="10" fill="#F59E0B" text-anchor="middle">Limit: 0.55</text>
      <text x="24" y="130" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#FBBF24">Status: Active Yawn Pattern Detected</text>
    </g>

    <!-- Panel 3: Architecture & Model Validation -->
    <g transform="translate(0, 336)">
      <rect width="375" height="154" rx="12" fill="#0A0F1D" stroke="#1E293B" stroke-width="1.5"/>
      <text x="24" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#94A3B8">MODEL VALIDATION BENCHMARK</text>
      
      <g transform="translate(24, 52)">
        <text x="0" y="15" font-family="-apple-system, sans-serif" font-size="12" fill="#CBD5E1">• MediaPipe Mesh: 468 landmarks @ 60 FPS</text>
        <text x="0" y="36" font-family="-apple-system, sans-serif" font-size="12" fill="#CBD5E1">• dlib 68-Point: Accurate offline baseline</text>
        <text x="0" y="57" font-family="-apple-system, sans-serif" font-size="12" fill="#CBD5E1">• MobileNetV2: Quantized edge deployment</text>
        <text x="0" y="78" font-family="-apple-system, sans-serif" font-size="12" fill="#38BDF8">• Grad-CAM: Attention focused on ocular cues</text>
      </g>
    </g>
  </g>
</svg>
