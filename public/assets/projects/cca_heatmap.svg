<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Dark/Modern Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <!-- Heatmap Gradient for Colorbar -->
    <linearGradient id="cbarGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EBF4FE" />
      <stop offset="25%" stop-color="#93C5FD" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="75%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F2B66" />
    </linearGradient>
  </defs>

  <!-- Clean Card Base with Shadow -->
  <rect x="20" y="20" width="960" height="560" rx="16" fill="#FFFFFF" filter="url(#shadow)" />

  <!-- Heatmap Title -->
  <text x="460" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1E293B" text-anchor="middle">
    Comparative Model Performance - Patient-Level CV AUC
  </text>

  <!-- Y-Axis Label: Feature Selection Pipeline -->
  <g transform="translate(42, 305) rotate(-90)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">
      Feature Selection Pipeline
    </text>
  </g>

  <!-- Heatmap Grid Container: x: 130 to 790 (width 660, 6 columns = 110 width each), y: 110 to 440 (height 330, 3 rows = 110 height each) -->
  <g transform="translate(130, 110)">
    <!-- Row 1: LASSO (y: 0) -->
    <!-- Col 1: LightGBM (0.994) -->
    <rect x="0" y="0" width="110" height="110" fill="#1E4CB0" stroke="#FFFFFF" stroke-width="2" />
    <text x="55" y="60" font-family="monospace" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">0.994</text>

    <!-- Col 2: Logistic Regression (0.999) -->
    <rect x="110" y="0" width="110" height="110" fill="#16388C" stroke="#FFFFFF" stroke-width="2" />
    <text x="165" y="60" font-family="monospace" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">0.999</text>

    <!-- Col 3: Naive Bayes (0.999) -->
    <rect x="220" y="0" width="110" height="110" fill="#16388C" stroke="#FFFFFF" stroke-width="2" />
    <text x="275" y="60" font-family="monospace" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">0.999</text>

    <!-- Col 4: Random Forest (0.999) -->
    <rect x="330" y="0" width="110" height="110" fill="#16388C" stroke="#FFFFFF" stroke-width="2" />
    <text x="385" y="60" font-family="monospace" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">0.999</text>

    <!-- Col 5: SVM (1.000) -->
    <rect x="440" y="0" width="110" height="110" fill="#0F2862" stroke="#FFFFFF" stroke-width="2" />
    <text x="495" y="60" font-family="monospace" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1.000</text>

    <!-- Col 6: XGBoost (0.993) -->
    <rect x="550" y="0" width="110" height="110" fill="#2050B8" stroke="#FFFFFF" stroke-width="2" />
    <text x="605" y="60" font-family="monospace" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">0.993</text>

    <!-- Row 2: SVM-RFE (y: 110) -->
    <!-- Col 1: LightGBM (0.980) -->
    <rect x="0" y="110" width="110" height="110" fill="#2E69D8" stroke="#FFFFFF" stroke-width="2" />
    <text x="55" y="170" font-family="monospace" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">0.980</text>

    <!-- Col 2: Logistic Regression (1.000) -->
    <rect x="110" y="110" width="110" height="110" fill="#0F2862" stroke="#FFFFFF" stroke-width="2" />
    <text x="165" y="170" font-family="monospace" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1.000</text>

    <!-- Col 3: Naive Bayes (1.000) -->
    <rect x="220" y="110" width="110" height="110" fill="#0F2862" stroke="#FFFFFF" stroke-width="2" />
    <text x="275" y="170" font-family="monospace" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1.000</text>

    <!-- Col 4: Random Forest (1.000) -->
    <rect x="330" y="110" width="110" height="110" fill="#0F2862" stroke="#FFFFFF" stroke-width="2" />
    <text x="385" y="170" font-family="monospace" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1.000</text>

    <!-- Col 5: SVM (1.000) -->
    <rect x="440" y="110" width="110" height="110" fill="#0F2862" stroke="#FFFFFF" stroke-width="2" />
    <text x="495" y="170" font-family="monospace" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1.000</text>

    <!-- Col 6: XGBoost (0.984) -->
    <rect x="550" y="110" width="110" height="110" fill="#2860D0" stroke="#FFFFFF" stroke-width="2" />
    <text x="605" y="170" font-family="monospace" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">0.984</text>

    <!-- Row 3: Random Forest (y: 220) -->
    <!-- Col 1: LightGBM (0.984) -->
    <rect x="0" y="220" width="110" height="110" fill="#2860D0" stroke="#FFFFFF" stroke-width="2" />
    <text x="55" y="280" font-family="monospace" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">0.984</text>

    <!-- Col 2: Logistic Regression (1.000) -->
    <rect x="110" y="220" width="110" height="110" fill="#0F2862" stroke="#FFFFFF" stroke-width="2" />
    <text x="165" y="280" font-family="monospace" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1.000</text>

    <!-- Col 3: Naive Bayes (1.000) -->
    <rect x="220" y="220" width="110" height="110" fill="#0F2862" stroke="#FFFFFF" stroke-width="2" />
    <text x="275" y="280" font-family="monospace" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1.000</text>

    <!-- Col 4: Random Forest (1.000) -->
    <rect x="330" y="220" width="110" height="110" fill="#0F2862" stroke="#FFFFFF" stroke-width="2" />
    <text x="385" y="280" font-family="monospace" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1.000</text>

    <!-- Col 5: SVM (1.000) -->
    <rect x="440" y="220" width="110" height="110" fill="#0F2862" stroke="#FFFFFF" stroke-width="2" />
    <text x="495" y="280" font-family="monospace" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1.000</text>

    <!-- Col 6: XGBoost (0.983) -->
    <rect x="550" y="220" width="110" height="110" fill="#2A64D4" stroke="#FFFFFF" stroke-width="2" />
    <text x="605" y="280" font-family="monospace" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">0.983</text>

    <!-- Y-axis Tick Labels -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#1E293B" text-anchor="end">
      <text x="-14" y="60">LASSO</text>
      <text x="-14" y="170">SVM-RFE</text>
      <text x="-14" y="280">Random Forest</text>
    </g>

    <!-- X-axis Tick Labels (Angled) -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#1E293B" text-anchor="end">
      <text x="55" y="350" transform="rotate(-30 55 350)">LightGBM</text>
      <text x="165" y="350" transform="rotate(-30 165 350)">Logistic Regression</text>
      <text x="275" y="350" transform="rotate(-30 275 350)">Naive Bayes</text>
      <text x="385" y="350" transform="rotate(-30 385 350)">Random Forest</text>
      <text x="495" y="350" transform="rotate(-30 495 350)">SVM</text>
      <text x="605" y="350" transform="rotate(-30 605 350)">XGBoost</text>
    </g>

    <!-- X-axis Label: Model -->
    <text x="330" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">
      Model
    </text>

    <!-- Colorbar on right -->
    <g transform="translate(700, 15)">
      <rect x="0" y="0" width="22" height="300" rx="3" fill="url(#cbarGrad)" stroke="#CBD5E1" stroke-width="1" />
      <g font-family="monospace" font-size="11" font-weight="600" fill="#475569">
        <text x="28" y="10">1.00</text>
        <text x="28" y="80">0.98</text>
        <text x="28" y="155">0.96</text>
        <text x="28" y="230">0.94</text>
        <text x="28" y="300">0.90</text>
      </g>
    </g>
  </g>
</svg>
