<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <radialGradient id="rep-bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#141926"/>
      <stop offset="100%" stop-color="#080B10"/>
    </radialGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#rep-bg)"/>

  <!-- Figma Framing -->
  <g transform="translate(60, 45)" filter="url(#boxShadow)">
    <rect width="1080" height="585" rx="16" fill="#0D111A" stroke="#252F44" stroke-width="2"/>
    
    <!-- Top Nav Header -->
    <rect width="1080" height="50" rx="16" fill="#161C28"/>
    <rect y="35" width="1080" height="15" fill="#161C28"/>
    <circle cx="28" cy="25" r="5" fill="#EF4444"/>
    <circle cx="46" cy="25" r="5" fill="#F59E0B"/>
    <circle cx="64" cy="25" r="5" fill="#10B981"/>

    <text x="540" y="31" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0" text-anchor="middle" letter-spacing="0.5">
      FIGMA UI/UX DESIGN • OVERDUE &amp; FINANCIAL REPORTING VIEW
    </text>

    <!-- Main Container Grid -->
    <g transform="translate(30, 70)">
      <!-- Left Box: Invoicing & Payment Gateway Simulator -->
      <g transform="translate(0, 0)">
        <rect width="490" height="465" rx="12" fill="#111622" stroke="#1F2638" stroke-width="1"/>
        <text x="24" y="32" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Invoice Generation &amp; Tenant Payment Flow</text>

        <!-- Invoice Card Sample -->
        <g transform="translate(24, 52)">
          <rect width="442" height="180" rx="10" fill="#182030" stroke="#334155" stroke-width="1"/>
          <text x="18" y="28" font-family="monospace" font-size="13" font-weight="700" fill="#60A5FA">INVOICE: #INV-2026-0202</text>
          <rect x="330" y="14" width="94" height="22" rx="11" fill="#F59E0B" fill-opacity="0.2"/>
          <text x="377" y="29" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="700" fill="#FBBF24" text-anchor="middle">JATUH TEMPO</text>

          <text x="18" y="60" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#94A3B8">Penyewa: <tspan fill="#FFFFFF" font-weight="600">Dinda Salsabila</tspan></text>
          <text x="18" y="80" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#94A3B8">Kamar: <tspan fill="#FFFFFF" font-weight="600">Kamar 103 (Standard Room)</tspan></text>
          <text x="18" y="100" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#94A3B8">Periode: <tspan fill="#FFFFFF" font-weight="600">Februari 2026</tspan></text>
          
          <line x1="18" y1="120" x2="424" y2="120" stroke="#2D3748" stroke-width="1"/>
          
          <text x="18" y="148" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">Total Tagihan:</text>
          <text x="424" y="148" font-family="monospace" font-size="16" font-weight="800" fill="#34D399" text-anchor="end">Rp 1.400.000</text>
        </g>

        <!-- Automation Features -->
        <g transform="translate(24, 250)">
          <text x="0" y="16" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Integrasi Fitur Database:</text>
          
          <g transform="translate(0, 30)">
            <circle cx="8" cy="8" r="4" fill="#3B82F6"/>
            <text x="22" y="12" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#CBD5E1">Automated Overdue Warning WhatsApp &amp; In-App Notification</text>
          </g>
          <g transform="translate(0, 60)">
            <circle cx="8" cy="8" r="4" fill="#10B981"/>
            <text x="22" y="12" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#CBD5E1">Instant Referential Sync ke Master Ledger Keuangan</text>
          </g>
          <g transform="translate(0, 90)">
            <circle cx="8" cy="8" r="4" fill="#8B5CF6"/>
            <text x="22" y="12" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#CBD5E1">Dynamic Stored Procedure Audit Log &amp; Payment Verification</text>
          </g>
        </g>
      </g>

      <!-- Right Box: Financial & Room Occupancy Analytical Report -->
      <g transform="translate(520, 0)">
        <rect width="500" height="465" rx="12" fill="#111622" stroke="#1F2638" stroke-width="1"/>
        <text x="24" y="32" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Executive Reporting &amp; Revenue Analytics</text>

        <!-- Chart Visualization Mock -->
        <g transform="translate(24, 52)">
          <rect width="452" height="180" rx="10" fill="#182030" stroke="#334155" stroke-width="1"/>
          <text x="18" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#94A3B8">OCCUPANCY RATE &amp; REVENUE TREND (LAST 6 MONTHS)</text>

          <!-- Bar Chart Items -->
          <g transform="translate(30, 45)">
            <!-- Sep -->
            <rect x="0" y="40" width="36" height="70" rx="4" fill="#3B82F6"/>
            <text x="18" y="125" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Sep</text>

            <!-- Oct -->
            <rect x="65" y="30" width="36" height="80" rx="4" fill="#3B82F6"/>
            <text x="83" y="125" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Okt</text>

            <!-- Nov -->
            <rect x="130" y="20" width="36" height="90" rx="4" fill="#3B82F6"/>
            <text x="148" y="125" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Nov</text>

            <!-- Dec -->
            <rect x="195" y="10" width="36" height="100" rx="4" fill="#3B82F6"/>
            <text x="213" y="125" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Des</text>

            <!-- Jan -->
            <rect x="260" y="15" width="36" height="95" rx="4" fill="#3B82F6"/>
            <text x="278" y="125" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Jan</text>

            <!-- Feb (Current / Highlighted) -->
            <rect x="325" y="0" width="36" height="110" rx="4" fill="#10B981"/>
            <text x="343" y="125" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">Feb</text>
          </g>
        </g>

        <!-- KPI Metrics Summary Grid -->
        <g transform="translate(24, 250)">
          <g transform="translate(0, 0)">
            <rect width="215" height="75" rx="8" fill="#182030" stroke="#334155" stroke-width="1"/>
            <text x="14" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="700" fill="#94A3B8">OCCUPANCY RATE</text>
            <text x="14" y="55" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">87.5%</text>
          </g>

          <g transform="translate(237, 0)">
            <rect width="215" height="75" rx="8" fill="#182030" stroke="#334155" stroke-width="1"/>
            <text x="14" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="700" fill="#94A3B8">COLLECTION RATE</text>
            <text x="14" y="55" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="800" fill="#10B981">93.2%</text>
          </g>

          <g transform="translate(0, 88)">
            <rect width="452" height="50" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
            <text x="16" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#93C5FD">
              🔗 Full Interactive Prototype available on Figma Design
            </text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
