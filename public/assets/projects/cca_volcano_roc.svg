<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <filter id="shadowVolc" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="20" y="20" width="960" height="560" rx="16" fill="#FFFFFF" filter="url(#shadowVolc)" />

  <text x="500" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">
    Differential Gene Expression (Volcano) & ROC Generalization Curves
  </text>
  <text x="500" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">
    Discovery Cohort GSE76297 (N=91 Paired) & Independent External Cohort GSE26566
  </text>

  <!-- Left: Volcano Plot -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="400" height="360" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="200" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">
      Transcriptomic Volcano Plot
    </text>

    <!-- Axes -->
    <line x1="60" y1="310" x2="360" y2="310" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="60" y1="60" x2="60" y2="310" stroke="#94A3B8" stroke-width="1.5" />
    <!-- Cutoff dashed lines -->
    <line x1="160" y1="60" x2="160" y2="310" stroke="#CBD5E1" stroke-dasharray="4,4" />
    <line x1="260" y1="60" x2="260" y2="310" stroke="#CBD5E1" stroke-dasharray="4,4" />
    <line x1="60" y1="200" x2="360" y2="200" stroke="#CBD5E1" stroke-dasharray="4,4" />

    <!-- Points (Scatter simulation) -->
    <!-- Non-significant points -->
    <g fill="#94A3B8" opacity="0.4">
      <circle cx="190" cy="270" r="3" /><circle cx="210" cy="285" r="3" /><circle cx="205" cy="240" r="3" />
      <circle cx="180" cy="250" r="3" /><circle cx="225" cy="265" r="3" /><circle cx="195" cy="290" r="3" />
      <circle cx="215" cy="230" r="3" /><circle cx="175" cy="280" r="3" /><circle cx="230" cy="250" r="3" />
    </g>
    <!-- Significant Upregulated (Red) -->
    <g fill="#EF4444" opacity="0.85">
      <circle cx="290" cy="110" r="4.5" /><circle cx="310" cy="95" r="5" /><circle cx="325" cy="80" r="5.5" />
      <circle cx="280" cy="140" r="4" /><circle cx="335" cy="115" r="5" /><circle cx="300" cy="130" r="4.5" />
      <circle cx="315" cy="160" r="4" />
      <text x="330" y="70" font-family="monospace" font-size="10" font-weight="700" fill="#DC2626">MUC1</text>
      <text x="320" y="105" font-family="monospace" font-size="10" font-weight="700" fill="#DC2626">EPCAM</text>
    </g>
    <!-- Significant Downregulated (Blue) -->
    <g fill="#3B82F6" opacity="0.85">
      <circle cx="130" cy="120" r="4.5" /><circle cx="110" cy="100" r="5" /><circle cx="95" cy="85" r="5.5" />
      <circle cx="140" cy="150" r="4" /><circle cx="90" cy="120" r="5" /><circle cx="120" cy="135" r="4.5" />
      <text x="90" y="75" font-family="monospace" font-size="10" font-weight="700" fill="#2563EB">ALB</text>
      <text x="100" y="115" font-family="monospace" font-size="10" font-weight="700" fill="#2563EB">CYP3A4</text>
    </g>

    <text x="210" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">
      log2 Fold Change
    </text>
    <text x="30" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle" transform="rotate(-90 30 180)">
      -log10(p-value)
    </text>
  </g>

  <!-- Right: ROC Curves -->
  <g transform="translate(520, 130)">
    <rect x="0" y="0" width="400" height="360" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="200" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">
      Receiver Operating Characteristic (ROC)
    </text>

    <!-- Axes -->
    <line x1="60" y1="300" x2="340" y2="300" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="60" y1="60" x2="60" y2="300" stroke="#94A3B8" stroke-width="1.5" />
    <!-- Chance diagonal -->
    <line x1="60" y1="300" x2="340" y2="60" stroke="#CBD5E1" stroke-dasharray="4,4" />

    <!-- ROC Curve 1: Discovery GSE76297 (AUC = 0.999) -->
    <path d="M 60 300 L 62 65 L 340 60" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" />

    <!-- ROC Curve 2: External Validation GSE26566 (AUC = 0.984) -->
    <path d="M 60 300 Q 68 85 90 75 L 340 60" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" />

    <!-- Legend -->
    <g transform="translate(100, 200)">
      <rect x="0" y="0" width="220" height="75" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
      <line x1="15" y1="24" x2="45" y2="24" stroke="#2563EB" stroke-width="3" />
      <text x="55" y="28" font-family="monospace" font-size="11" font-weight="700" fill="#1E40AF">GSE76297 (AUC = 1.00)</text>

      <line x1="15" y1="50" x2="45" y2="50" stroke="#059669" stroke-width="3" />
      <text x="55" y="54" font-family="monospace" font-size="11" font-weight="700" fill="#065F46">GSE26566 (AUC = 0.99)</text>
    </g>

    <text x="200" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">
      False Positive Rate (1 - Specificity)
    </text>
    <text x="30" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle" transform="rotate(-90 30 180)">
      True Positive Rate (Sensitivity)
    </text>
  </g>
</svg>
