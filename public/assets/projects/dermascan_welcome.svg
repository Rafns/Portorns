<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 900" width="100%" height="100%">
  <defs>
    <style>
      .app-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 38px; font-weight: 800; fill: #FFFFFF; }
      .app-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 19px; line-height: 1.4; fill: #A1A1AA; font-weight: 400; }
      .feat-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #FFFFFF; }
      .feat-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #8E8E93; line-height: 1.4; }
      .disclaimer-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #8E8E93; line-height: 1.4; }
      .btn-primary { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 600; fill: #FFFFFF; }
      .btn-secondary { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 600; fill: #007AFF; }
    </style>
  </defs>

  <!-- Phone Background -->
  <rect width="450" height="900" rx="44" fill="#000000"/>
  
  <!-- Subtle Concentric Radar Rings -->
  <circle cx="225" cy="180" r="140" fill="none" stroke="#18181B" stroke-width="1.5"/>
  <circle cx="225" cy="180" r="220" fill="none" stroke="#18181B" stroke-width="1.5"/>
  <circle cx="225" cy="180" r="300" fill="none" stroke="#18181B" stroke-width="1.5"/>

  <!-- Content Container -->
  <g transform="translate(32, 60)">
    <!-- App Title -->
    <text x="0" y="40" class="app-title">DermaScan</text>
    
    <!-- Subtitle -->
    <text x="0" y="85" class="app-desc">AI-assisted skin screening,</text>
    <text x="0" y="112" class="app-desc">designed to be calm, fast,</text>
    <text x="0" y="139" class="app-desc">and medically responsible.</text>

    <!-- Feature 1: Capture or upload -->
    <g transform="translate(0, 180)">
      <!-- Camera Icon -->
      <path d="M 6 12 C 6 10.9 6.9 10 8 10 L 11 10 L 12.5 7.5 C 12.8 7 13.4 6.7 14 6.7 L 20 6.7 C 20.6 6.7 21.2 7 21.5 7.5 L 23 10 L 26 10 C 27.1 10 28 10.9 28 12 L 28 24 C 28 25.1 27.1 26 26 26 L 8 26 C 6.9 26 6 25.1 6 24 Z" fill="none" stroke="#007AFF" stroke-width="2"/>
      <circle cx="17" cy="18" r="4.5" fill="none" stroke="#007AFF" stroke-width="2"/>
      
      <text x="42" y="15" class="feat-title">Capture or upload</text>
      <text x="42" y="36" class="feat-desc">Frame the skin area clearly in bright, even</text>
      <text x="42" y="54" class="feat-desc">lighting.</text>
    </g>

    <!-- Feature 2: Screen visual patterns -->
    <g transform="translate(0, 265)">
      <!-- Sparkle Icon -->
      <path d="M 17 6 L 19 13 L 26 15 L 19 17 L 17 24 L 15 17 L 8 15 L 15 13 Z" fill="#007AFF"/>
      <path d="M 25 21 L 26 24 L 29 25 L 26 26 L 25 29 L 24 26 L 21 25 L 24 24 Z" fill="#007AFF"/>
      
      <text x="42" y="15" class="feat-title">Screen visual patterns</text>
      <text x="42" y="36" class="feat-desc">The model suggests a possible category</text>
      <text x="42" y="54" class="feat-desc">with a confidence score.</text>
    </g>

    <!-- Feature 3: Learn what to do next -->
    <g transform="translate(0, 350)">
      <!-- Heart Icon -->
      <path d="M 17 25 C 17 25 7 19 7 13 C 7 9.5 9.5 7 13 7 C 15 7 16.5 8 17 9.2 C 17.5 8 19 7 21 7 C 24.5 7 27 9.5 27 13 C 27 19 17 25 17 25 Z" fill="none" stroke="#007AFF" stroke-width="2"/>
      
      <text x="42" y="15" class="feat-title">Learn what to do next</text>
      <text x="42" y="36" class="feat-desc">Read plain-language information and seek</text>
      <text x="42" y="54" class="feat-desc">care when appropriate.</text>
    </g>

    <!-- Disclaimer Box -->
    <g transform="translate(0, 470)">
      <rect width="386" height="85" rx="14" fill="#1C1C1E"/>
      <text x="18" y="28" class="disclaimer-text">DermaScan is an informational screening</text>
      <text x="18" y="46" class="disclaimer-text">assistant and is not a substitute for</text>
      <text x="18" y="64" class="disclaimer-text">professional medical advice.</text>
    </g>

    <!-- Buttons -->
    <g transform="translate(0, 600)">
      <!-- Get Started Button -->
      <rect width="386" height="52" rx="26" fill="#007AFF"/>
      <text x="193" y="32" class="btn-primary" text-anchor="middle">Get Started</text>

      <!-- I understand Button -->
      <rect y="68" width="386" height="52" rx="26" fill="#FFFFFF"/>
      <text x="193" y="100" class="btn-secondary" text-anchor="middle">I understand</text>
    </g>
  </g>
</svg>
