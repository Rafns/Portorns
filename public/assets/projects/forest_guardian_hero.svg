<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="skyForest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CA1AF"/>
      <stop offset="40%" stop-color="#73C8A9"/>
      <stop offset="100%" stop-color="#2C5E43"/>
    </linearGradient>
    <linearGradient id="forestFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D5A27"/>
      <stop offset="50%" stop-color="#1E3F1B"/>
      <stop offset="100%" stop-color="#142B12"/>
    </linearGradient>
    <linearGradient id="sunbeam" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="healAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <filter id="forestGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky & Ambient Atmosphere -->
  <rect width="1200" height="675" fill="url(#skyForest)"/>

  <!-- Sun Rays / Volumetric God Rays (Unity Lighting) -->
  <polygon points="150,-20 380,-20 620,675 280,675" fill="url(#sunbeam)"/>
  <polygon points="520,-20 720,-20 980,675 700,675" fill="url(#sunbeam)"/>
  <polygon points="780,-20 920,-20 1180,675 960,675" fill="url(#sunbeam)"/>

  <!-- Background Mountain Ridges & Dense Canopy -->
  <path d="M 0 320 Q 200 240 450 300 T 900 260 T 1200 310 L 1200 675 L 0 675 Z" fill="#204E35" opacity="0.85"/>
  <path d="M 0 360 Q 280 300 600 350 T 1200 330 L 1200 675 L 0 675 Z" fill="#1B432E" opacity="0.95"/>

  <!-- Forest Ground Plane -->
  <rect y="390" width="1200" height="285" fill="url(#forestFloor)"/>

  <!-- Mossy Ground Textures & Foliage Hills -->
  <path d="M 0 450 Q 300 410 650 460 T 1200 430 L 1200 675 L 0 675 Z" fill="#173516"/>
  <path d="M 0 520 Q 400 480 800 530 T 1200 500 L 1200 675 L 0 675 Z" fill="#122A11"/>

  <!-- Ancient Sacred Oak Trees & Trunks -->
  <!-- Left Giant Tree -->
  <g transform="translate(60, 140)">
    <!-- Tree Trunk -->
    <path d="M 90 535 C 70 420 85 240 70 120 C 65 80 50 20 60 -40 L 140 -40 C 145 20 135 90 145 150 C 160 260 175 420 220 535 Z" fill="#3E2723"/>
    <!-- Bark Texture Lines -->
    <path d="M 95 180 Q 115 300 120 460" stroke="#271610" stroke-width="4" fill="none" opacity="0.7"/>
    <path d="M 125 150 Q 140 280 155 450" stroke="#271610" stroke-width="4" fill="none" opacity="0.7"/>
    <!-- Canopy Foliage Masses -->
    <circle cx="80" cy="-10" r="110" fill="#2E7D32"/>
    <circle cx="150" cy="30" r="120" fill="#388E3C"/>
    <circle cx="90" cy="70" r="100" fill="#43A047"/>
    <!-- Vines hanging -->
    <path d="M 75 140 Q 55 220 65 290 Q 75 330 68 370" stroke="#66BB6A" stroke-width="3" fill="none"/>
    <path d="M 135 150 Q 150 240 142 320" stroke="#66BB6A" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Right Giant Tree (Recovering from Damage) -->
  <g transform="translate(900, 160)">
    <path d="M 110 515 C 95 400 110 240 95 120 L 175 120 C 180 240 200 400 240 515 Z" fill="#4E342E"/>
    <circle cx="140" cy="40" r="120" fill="#388E3C"/>
    <circle cx="90" cy="80" r="100" fill="#43A047"/>
    <circle cx="180" cy="70" r="95" fill="#66BB6A"/>
  </g>

  <!-- Restored Ecological Clearing in Center -->
  <!-- Glowing Restoration Aura with Native Saplings -->
  <circle cx="580" cy="470" r="160" fill="url(#healAura)"/>
  
  <!-- Magic Healing Spores / Fireflies / Pollen -->
  <g fill="#A7F3D0" filter="url(#forestGlow)">
    <circle cx="510" cy="440" r="4"/>
    <circle cx="540" cy="390" r="3"/>
    <circle cx="590" cy="420" r="5"/>
    <circle cx="630" cy="370" r="3.5"/>
    <circle cx="670" cy="430" r="4.5"/>
    <circle cx="570" cy="490" r="3"/>
    <circle cx="480" cy="480" r="2.5"/>
    <circle cx="690" cy="480" r="3.5"/>
  </g>

  <!-- Distressed & Rescued Wildlife: Young Woodland Deer (Fawn) -->
  <g transform="translate(480, 410)">
    <!-- Deer Shadow -->
    <ellipse cx="65" cy="115" rx="42" ry="12" fill="#0A180A" opacity="0.6"/>
    <!-- Deer Body -->
    <ellipse cx="65" cy="70" rx="36" ry="24" fill="#C27D38"/>
    <!-- Deer Spots -->
    <circle cx="50" cy="62" r="3" fill="#FFF7ED"/>
    <circle cx="62" cy="58" r="3" fill="#FFF7ED"/>
    <circle cx="74" cy="64" r="3" fill="#FFF7ED"/>
    <circle cx="60" cy="72" r="2.5" fill="#FFF7ED"/>
    <!-- Deer Neck & Head -->
    <path d="M 85 70 C 95 60 100 45 105 32 C 108 24 118 20 125 25 C 130 30 128 42 120 50 C 112 58 100 78 92 84 Z" fill="#C27D38"/>
    <!-- Deer Ears -->
    <ellipse cx="108" cy="18" rx="5" ry="12" fill="#D98A43" transform="rotate(-20, 108, 18)"/>
    <ellipse cx="118" cy="16" rx="5" ry="12" fill="#C27D38" transform="rotate(15, 118, 16)"/>
    <!-- Deer Eye & Muzzle -->
    <circle cx="122" cy="30" r="3" fill="#1C1917"/>
    <circle cx="123" cy="29" r="1" fill="#FFFFFF"/>
    <ellipse cx="128" cy="34" rx="4" ry="3" fill="#1C1917"/>
    <!-- Deer Legs -->
    <rect x="42" y="80" width="7" height="38" rx="3.5" fill="#A86224"/>
    <rect x="54" y="82" width="6" height="36" rx="3" fill="#8F4F19"/>
    <rect x="80" y="80" width="7" height="38" rx="3.5" fill="#A86224"/>
    <rect x="90" y="82" width="6" height="36" rx="3" fill="#8F4F19"/>
    <!-- Friendly Heart Prompt above rescued animal -->
    <g transform="translate(105, -15)">
      <circle cx="14" cy="14" r="16" fill="#10B981" filter="url(#forestGlow)"/>
      <path d="M 14 20 C 14 20 6 15 6 10 C 6 7.5 8 5.5 10.5 5.5 C 12 5.5 13.5 6.5 14 7.5 C 14.5 6.5 16 5.5 17.5 5.5 C 20 5.5 22 7.5 22 10 C 22 15 14 20 14 20 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Player Character (Forest Ranger / Guardian) with Eco Scanner Tool -->
  <g transform="translate(320, 390)">
    <!-- Shadow -->
    <ellipse cx="40" cy="140" rx="30" ry="10" fill="#0A180A" opacity="0.6"/>
    <!-- Boots -->
    <rect x="25" y="115" width="12" height="26" rx="5" fill="#422006"/>
    <rect x="42" y="115" width="12" height="26" rx="5" fill="#422006"/>
    <!-- Trousers -->
    <rect x="25" y="85" width="13" height="34" rx="4" fill="#365314"/>
    <rect x="41" y="85" width="13" height="34" rx="4" fill="#365314"/>
    <!-- Ranger Jacket (Forest Green) -->
    <rect x="18" y="38" width="44" height="52" rx="8" fill="#15803D"/>
    <!-- Belt with eco-pouch -->
    <rect x="16" y="78" width="48" height="8" rx="2" fill="#78350F"/>
    <rect x="20" y="76" width="12" height="12" rx="2" fill="#B45309"/>
    <!-- Ranger Hat & Head -->
    <circle cx="40" cy="22" r="15" fill="#FDE68A"/>
    <ellipse cx="40" cy="14" rx="26" ry="6" fill="#713F12"/>
    <rect x="26" y="2" width="28" height="14" rx="5" fill="#854D0E"/>
    <!-- Eco-Scanner Device / Seed Planter in Hand -->
    <rect x="62" y="48" width="22" height="14" rx="4" fill="#1E293B"/>
    <circle cx="73" cy="55" r="4" fill="#34D399" filter="url(#forestGlow)"/>
    <line x1="73" y1="55" x2="160" y2="55" stroke="#34D399" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>
  </g>

  <!-- Fresh Planted Sapling with Growth Ring -->
  <g transform="translate(680, 480)">
    <circle cx="16" cy="30" r="22" fill="#065F46" opacity="0.5"/>
    <path d="M 16 32 L 16 8 Q 16 2 24 2 Q 22 10 16 12 Q 10 10 8 2 Q 16 2 16 8" fill="#34D399" stroke="#059669" stroke-width="1.5"/>
    <text x="16" y="-6" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">🌱 Oak Sapling Planted</text>
  </g>

  <!-- ==================== 3D UNITY GAME HUD ==================== -->
  <!-- Top Left: Quest Tracker & Eco Objective -->
  <g transform="translate(35, 30)">
    <rect width="360" height="90" rx="12" fill="#0B1E13" fill-opacity="0.9" stroke="#10B981" stroke-width="1.5"/>
    <text x="18" y="26" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#34D399">🎯 ACTIVE QUEST: ECO-RESTORATION</text>
    <text x="18" y="50" font-family="-apple-system, sans-serif" font-size="12" fill="#ECFDF5">✔ Rescue Distressed Animals (1/1 Complete)</text>
    <text x="18" y="70" font-family="-apple-system, sans-serif" font-size="12" fill="#FDE047">⏳ Plant Native Saplings (3/5 Planted)</text>
  </g>

  <!-- Top Center: Forest Health Progress Bar -->
  <g transform="translate(420, 30)">
    <rect width="360" height="60" rx="12" fill="#0B1E13" fill-opacity="0.9" stroke="#10B981" stroke-width="1.5"/>
    <text x="20" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#A7F3D0">FOREST ECOSYSTEM HEALTH</text>
    <text x="340" y="24" font-family="-apple-system, monospace" font-size="13" font-weight="800" fill="#34D399" text-anchor="end">78% RESTORED</text>
    
    <!-- Health Bar -->
    <rect x="20" y="34" width="320" height="12" rx="6" fill="#143722"/>
    <rect x="20" y="34" width="250" height="12" rx="6" fill="#10B981"/>
  </g>

  <!-- Top Right: Engine & Performance Stats -->
  <g transform="translate(860, 30)">
    <rect width="305" height="60" rx="12" fill="#0B1E13" fill-opacity="0.9" stroke="#10B981" stroke-width="1.5"/>
    <text x="18" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#34D399">UNITY 3D ENGINE</text>
    <text x="285" y="24" font-family="-apple-system, monospace" font-size="11" font-weight="700" fill="#FDE047" text-anchor="end">60 FPS</text>
    <text x="18" y="46" font-family="-apple-system, monospace" font-size="11" fill="#A7F3D0">C# Scripts • Wildlife AI • Eco Quizzes</text>
  </g>

  <!-- Bottom Left: Inventory Hotbar (Acorns, Clean Water, Saplings) -->
  <g transform="translate(35, 570)">
    <rect width="340" height="65" rx="12" fill="#0B1E13" fill-opacity="0.9" stroke="#10B981" stroke-width="1.5"/>
    <!-- Slot 1 -->
    <g transform="translate(20, 10)">
      <rect width="45" height="45" rx="8" fill="#143722" stroke="#34D399" stroke-width="1"/>
      <text x="22.5" y="26" font-size="16" text-anchor="middle">💧</text>
      <text x="38" y="40" font-family="-apple-system, monospace" font-size="10" font-weight="700" fill="#FFFFFF">4</text>
    </g>
    <!-- Slot 2 -->
    <g transform="translate(75, 10)">
      <rect width="45" height="45" rx="8" fill="#143722" stroke="#34D399" stroke-width="1"/>
      <text x="22.5" y="26" font-size="16" text-anchor="middle">🌱</text>
      <text x="38" y="40" font-family="-apple-system, monospace" font-size="10" font-weight="700" fill="#FFFFFF">2</text>
    </g>
    <!-- Slot 3 -->
    <g transform="translate(130, 10)">
      <rect width="45" height="45" rx="8" fill="#143722" stroke="#34D399" stroke-width="1"/>
      <text x="22.5" y="26" font-size="16" text-anchor="middle">🌰</text>
      <text x="38" y="40" font-family="-apple-system, monospace" font-size="10" font-weight="700" fill="#FFFFFF">15</text>
    </g>
    <text x="195" y="32" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#34D399">RESTORATION PACK</text>
    <text x="195" y="48" font-family="-apple-system, sans-serif" font-size="10" fill="#A7F3D0">Keys [1, 2, 3] to Use</text>
  </g>

  <!-- Bottom Right: Educational Quiz Trigger Prompt -->
  <g transform="translate(780, 560)">
    <rect width="385" height="75" rx="12" fill="#0B1E13" fill-opacity="0.92" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="20" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#FBBF24">💡 ECO-QUIZ TRIGGERED: WILDFIRE PREVENTION</text>
    <text x="20" y="46" font-family="-apple-system, sans-serif" font-size="11" fill="#FEF3C7">"What is the best way to prevent forest fires in dry season?"</text>
    <text x="20" y="62" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#34D399">[Press 'E' to answer &amp; earn 100 Eco-XP]</text>
  </g>
</svg>
