<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 792" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching the soft azure tint -->
    <linearGradient id="azureCertBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#EFF6FF" />
      <stop offset="50%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#F0F9FF" />
    </linearGradient>

    <!-- Outer Deep Blue Border Frame -->
    <linearGradient id="blueFrame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#1E40AF" />
      <stop offset="100%" stopColor="#2563EB" />
    </linearGradient>
  </defs>

  <!-- Outer Deep Blue Border Canvas -->
  <rect width="1120" height="792" fill="#1E40AF" />

  <!-- Inner Certificate White/Soft Azure Card -->
  <rect x="24" y="24" width="1072" height="744" rx="6" fill="url(#azureCertBg)" stroke="#DBEAFE" strokeWidth="2" />

  <!-- Soft Abstract Azure Corner Waves -->
  <g fill="none" opacity="0.45">
    <path d="M 24 24 C 180 80, 240 240, 24 380" stroke="#93C5FD" strokeWidth="2" />
    <path d="M 1096 768 C 940 710, 880 550, 1096 410" stroke="#93C5FD" strokeWidth="2" />
  </g>

  <!-- Content Container -->
  <g transform="translate(70, 65)">
    <!-- Header Logos Row -->
    <g transform="translate(0, 0)">
      <!-- Microsoft Logo -->
      <g transform="translate(20, 0)">
        <!-- 4 Colored Squares -->
        <rect x="0" y="0" width="18" height="18" fill="#F25022" />
        <rect x="22" y="0" width="18" height="18" fill="#7FBA00" />
        <rect x="0" y="22" width="18" height="18" fill="#00A4EF" />
        <rect x="22" y="22" width="18" height="18" fill="#FFB900" />
        <text x="52" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#5E5E5E" letter-spacing="-0.5">
          Microsoft
        </text>
      </g>

      <!-- BINUS UNIVERSITY Logo -->
      <g transform="translate(420, -5)">
        <circle cx="16" cy="18" r="14" fill="#F97316" />
        <path d="M 16 4 Q 24 16 16 26 Q 20 18 16 4 Z" fill="#FFFFFF" />
        <text x="38" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#0F172A" letter-spacing="0.5">
          BINUS
        </text>
        <text x="38" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0284C7" letter-spacing="1">
          UNIVERSITY
        </text>
      </g>

      <!-- GreatNusa Logo -->
      <g transform="translate(740, -5)">
        <text x="0" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#0D9488">
          Great<tspan fill="#2563EB">Nusa</tspan>
        </text>
        <text x="14" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#64748B">
          by BINA NUSANTARA
        </text>
      </g>
    </g>

    <!-- Main Title: CERTIFICATE -->
    <text x="490" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="900" fill="#0F2850" text-anchor="middle" letter-spacing="6">
      CERTIFICATE
    </text>

    <!-- Subtitle: OF COMPLETION -->
    <text x="490" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#1E3A8A" text-anchor="middle" letter-spacing="2">
      OF COMPLETION
    </text>

    <!-- Cert No: 111541121814906/GreatNusa/II/2026 -->
    <text x="490" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">
      Cert No. 111541121814906/GreatNusa/II/2026
    </text>

    <!-- Horizontal divider line -->
    <line x1="140" y1="245" x2="840" y2="245" stroke="#CBD5E1" strokeWidth="1" />

    <!-- This is to certify that -->
    <text x="490" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#475569" text-anchor="middle">
      This is to certify that
    </text>

    <!-- RAFAEL NANDANA SAMBODO -->
    <text x="490" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="1">
      RAFAEL NANDANA SAMBODO
    </text>

    <!-- Microsoft AI Skills Round Badge Graphic on Right -->
    <g transform="translate(800, 240)">
      <circle cx="36" cy="36" r="36" fill="#EFF6FF" stroke="#3B82F6" strokeWidth="1.5" />
      <circle cx="36" cy="36" r="30" fill="#DBEAFE" opacity="0.6" />
      <rect x="28" y="16" width="6" height="6" fill="#F25022" />
      <rect x="36" y="16" width="6" height="6" fill="#7FBA00" />
      <rect x="28" y="24" width="6" height="6" fill="#00A4EF" />
      <rect x="36" y="24" width="6" height="6" fill="#FFB900" />
      <text x="36" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#1E40AF" text-anchor="middle">
        AI Skills
      </text>
    </g>

    <!-- Course & Completion Paragraphs -->
    <text x="490" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="middle">
      has successfully completed 15 hours of Learning
    </text>
    <text x="490" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="middle">
      the Microsoft Elevate AI Training Session
    </text>
    <text x="490" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">
      Pelatihan Azure AI Fundamentals: "Microsoft AI-900T00-A Belajar AI dari Dasar"
    </text>
    <text x="490" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">
      on February 20, 2026
    </text>
    <text x="490" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-style="italic" fill="#64748B" text-anchor="middle">
      with demonstration of learning
    </text>
    <text x="490" y="505" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">
      20/February/2026
    </text>

    <!-- Signatures Row -->
    <g transform="translate(0, 530)">
      <!-- Left Signer: Prof. Firdaus Alamsjah, Ph.D. -->
      <g transform="translate(140, 0)">
        <!-- Signature scribble -->
        <path d="M 40 30 C 60 5, 80 10, 100 25 C 110 35, 120 5, 140 20 M 60 35 L 120 15" stroke="#1E293B" strokeWidth="2" fill="none" strokeLinecap="round" />
        <text x="100" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">
          Prof. Firdaus Alamsjah, Ph.D.
        </text>
        <text x="100" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">
          Director GreatNusa
        </text>
      </g>

      <!-- Right Signer: Arief Suseno with Microsoft Logo -->
      <g transform="translate(680, 0)">
        <!-- Microsoft tiny logo + signature scribble -->
        <path d="M 40 35 C 50 10, 70 15, 85 30 C 95 10, 110 5, 130 25 M 65 15 L 125 35" stroke="#1E293B" strokeWidth="2" fill="none" strokeLinecap="round" />
        <g transform="translate(50, 4)">
          <text x="60" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#00A4EF">
            Microsoft
          </text>
        </g>
        <text x="100" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">
          Arief Suseno
        </text>
        <text x="100" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">
          Elevate Skills Director
        </text>
        <text x="100" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">
          Microsoft Indonesia
        </text>
      </g>
    </g>
  </g>
</svg>
