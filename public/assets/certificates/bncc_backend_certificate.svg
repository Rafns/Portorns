<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 792" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#F8FAFC" />
    </linearGradient>
    <linearGradient id="blueSideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E68F6" />
      <stop offset="100%" stopColor="#1551C9" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#3B82F6" stopOpacity="0.05" />
      <stop offset="50%" stopColor="#2563EB" stopOpacity="0.22" />
      <stop offset="100%" stopColor="#1D4ED8" stopOpacity="0.08" />
    </linearGradient>
  </defs>

  <!-- Base White Certificate Background -->
  <rect width="1120" height="792" fill="url(#bgGrad)" />

  <!-- Ethereal Flowing Curves on Certificate Body -->
  <g fill="none" stroke="url(#waveGrad)">
    <path d="M 60 480 C 220 380, 480 620, 820 460" strokeWidth="1.2" />
    <path d="M 40 520 C 260 420, 520 640, 820 490" strokeWidth="1.2" />
    <path d="M 30 560 C 290 460, 560 670, 820 530" strokeWidth="1.4" />
    <path d="M 50 600 C 320 500, 590 690, 820 570" strokeWidth="1.2" />
    <path d="M 40 640 C 350 540, 620 720, 820 610" strokeWidth="1.0" />
    <path d="M 120 380 C 380 260, 620 490, 820 380" strokeWidth="1.0" />
    <path d="M 160 420 C 420 300, 660 520, 820 410" strokeWidth="1.0" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(60, 50)">
    <!-- 5 Blue Stars -->
    <g fill="#1D64F2">
      <path d="M 0 10 L 4 0 L 8 10 L 0 4 L 8 4 Z" transform="scale(2) translate(0, 0)" />
      <path d="M 0 10 L 4 0 L 8 10 L 0 4 L 8 4 Z" transform="scale(2) translate(18, 0)" />
      <path d="M 0 10 L 4 0 L 8 10 L 0 4 L 8 4 Z" transform="scale(2) translate(36, 0)" />
      <path d="M 0 10 L 4 0 L 8 10 L 0 4 L 8 4 Z" transform="scale(2) translate(54, 0)" />
      <path d="M 0 10 L 4 0 L 8 10 L 0 4 L 8 4 Z" transform="scale(2) translate(72, 0)" />
    </g>

    <!-- Certificate Identifier -->
    <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E293B" letter-spacing="0.5">
      074/LNT/III/MEMBER/BNCC/MLG/XXXVI/08.2025
    </text>

    <!-- CERTIFICATE -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="900" fill="#0A0F1D" letter-spacing="2">
      CERTIFICATE
    </text>

    <!-- OF COMPLETION -->
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#1E293B" letter-spacing="1.5">
      OF COMPLETION
    </text>

    <!-- presented to: -->
    <text x="0" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#64748B">
      presented to:
    </text>

    <!-- Rafael Nandana Sambodo -->
    <text x="0" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#1D64F2" letter-spacing="0.5">
      Rafael Nandana Sambodo
    </text>

    <!-- NIM: 2802493714 -->
    <text x="0" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A">
      NIM: 2802493714
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#334155">
      that has successfully completed <tspan font-weight="700" fill="#0F172A">Back-End Development</tspan>
    </text>
    <text x="0" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#334155">
      class of 2024/2025, with achievement of <tspan font-weight="700" fill="#0F172A">High Distinction</tspan>
    </text>

    <!-- Signatures Section -->
    <g transform="translate(0, 520)">
      <!-- Signature 1: Stanley Pratama Teguh -->
      <g transform="translate(0, 0)">
        <path d="M 20 25 C 40 5, 70 -5, 90 20 C 110 40, 130 10, 150 15 M 40 35 L 140 10 M 80 -10 L 85 45" stroke="#1E293B" strokeWidth="1.8" fill="none" strokeLinecap="round" />
        <line x1="0" y1="50" x2="210" y2="50" stroke="#0F172A" strokeWidth="1.2" />
        <text x="105" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">
          Stanley Pratama Teguh
        </text>
        <text x="105" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">
          LnT Manager BNCC Malang
        </text>
      </g>

      <!-- Signature 2: Dewi Ailie Fennysia -->
      <g transform="translate(260, 0)">
        <path d="M 30 40 C 45 -10, 60 5, 80 40 C 90 20, 105 -5, 115 35 M 10 25 Q 70 15 130 30" stroke="#1E293B" strokeWidth="1.8" fill="none" strokeLinecap="round" />
        <line x1="0" y1="50" x2="210" y2="50" stroke="#0F172A" strokeWidth="1.2" />
        <text x="105" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">
          Dewi Ailie Fennysia
        </text>
        <text x="105" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">
          CEO of BNCC
        </text>
      </g>

      <!-- Signature 3: Devyano Luhukay -->
      <g transform="translate(510, 0)">
        <path d="M 25 35 C 40 10, 60 15, 75 35 C 90 5, 120 10, 140 30 M 55 5 L 125 40" stroke="#2563EB" strokeWidth="1.8" fill="none" strokeLinecap="round" />
        <line x1="0" y1="50" x2="210" y2="50" stroke="#0F172A" strokeWidth="1.2" />
        <text x="105" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">
          Devyano Luhukay
        </text>
        <text x="105" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">
          Student Involvement Centre
        </text>
        <text x="105" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">
          Manager BINUS University
        </text>
      </g>
    </g>
  </g>

  <!-- Right Royal Blue Sidebar Panel -->
  <g transform="translate(820, 0)">
    <rect width="300" height="792" fill="url(#blueSideGrad)" />

    <!-- BNCC Logo & Header -->
    <g transform="translate(40, 55)">
      <text x="0" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="-1">
        BNCC
      </text>
      <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">
        Unit Kegiatan Mahasiswa
      </text>
      <text x="0" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">
        BNCC (Computer Club)
      </text>
      <text x="0" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
        BINUS
      </text>
      <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" letter-spacing="1">
        UNIVERSITY
      </text>
    </g>

    <!-- Sparkle Stars -->
    <g fill="#FFFFFF" opacity="0.9">
      <!-- 4-point star sparkle 1 -->
      <path d="M 60 380 Q 75 380 75 365 Q 75 380 90 380 Q 75 380 75 395 Q 75 380 60 380 Z" />
      <!-- 4-point star sparkle 2 -->
      <path d="M 220 460 Q 230 460 230 450 Q 230 460 240 460 Q 230 460 230 470 Q 230 460 220 460 Z" />
    </g>

    <!-- Trophy Cup Graphic -->
    <g transform="translate(150, 680)">
      <!-- Trophy Laurel / Flame Backing -->
      <path d="M -50 -80 C -80 -160, 0 -220, 0 -220 C 0 -220, 80 -160, 50 -80 Z" fill="#60A5FA" opacity="0.35" />
      <path d="M -25 -60 C -50 -130, 0 -180, 0 -180 C 0 -180, 50 -130, 25 -60 Z" fill="#93C5FD" opacity="0.4" />

      <!-- Trophy Cup Base & Bowl -->
      <path d="M -60 -90 L 60 -90 L 45 -10 C 35 30, -35 30, -45 -10 Z" fill="#FFFFFF" opacity="0.95" />
      <!-- Cup Handles -->
      <path d="M -60 -80 C -95 -80, -95 -30, -45 -25" stroke="#FFFFFF" strokeWidth="8" fill="none" opacity="0.95" />
      <path d="M 60 -80 C 95 -80, 95 -30, 45 -25" stroke="#FFFFFF" strokeWidth="8" fill="none" opacity="0.95" />
      <!-- Trophy Stem & Base -->
      <rect x="-10" y="25" width="20" height="35" fill="#FFFFFF" opacity="0.95" />
      <rect x="-45" y="60" width="90" height="20" rx="4" fill="#FFFFFF" opacity="0.95" />
    </g>
  </g>
</svg>
