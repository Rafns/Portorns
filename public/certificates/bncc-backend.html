<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Certificate of Completion - BNCC LnT Back-End Development | Rafael Nandana Sambodo</title>
  <meta name="description" content="Verified Certificate of Completion for Back-End Development awarded to Rafael Nandana Sambodo with High Distinction by BNCC & BINUS University." />
  <link rel="icon" type="image/svg+xml" href="/assets/certificates/bncc_backend_certificate.svg" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #08090D;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 16px 48px;
    }
    .header-bar {
      max-width: 1120px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      padding: 12px 20px;
      background: rgba(18, 22, 32, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      backdrop-filter: blur(12px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #1D64F2;
      box-shadow: 0 0 10px #1D64F2;
    }
    .brand-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #E2E8F0;
      font-family: monospace;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      font-size: 12px;
      font-family: monospace;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #CBD5E1;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
    }
    .btn-primary {
      background: #1D64F2;
      border: 1px solid #1D64F2;
      color: #FFFFFF;
    }
    .btn-primary:hover {
      background: #1551C9;
    }
    .cert-frame {
      max-width: 1120px;
      width: 100%;
      aspect-ratio: 1120 / 792;
      background: #FFFFFF;
      border-radius: 12px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.15);
      overflow: hidden;
    }
    .cert-frame img, .cert-frame svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .footer-meta {
      margin-top: 20px;
      font-size: 11px;
      font-family: monospace;
      color: #64748B;
      text-align: center;
    }
    @media print {
      body {
        padding: 0;
        background: #FFFFFF;
      }
      .header-bar, .footer-meta {
        display: none;
      }
      .cert-frame {
        box-shadow: none;
        border-radius: 0;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <div class="brand">
      <div class="brand-dot"></div>
      <div class="brand-title">BNCC LnT • Official Credential Record</div>
    </div>
    <div class="actions">
      <a href="/" class="btn btn-secondary">← Back to Portfolio</a>
      <button onclick="window.print()" class="btn btn-primary">Print / Save PDF</button>
    </div>
  </div>

  <div class="cert-frame">
    <img src="/assets/certificates/bncc_backend_certificate.svg" alt="Certificate of Completion - BNCC LnT Back-End Development awarded to Rafael Nandana Sambodo" />
  </div>

  <div class="footer-meta">
    Official Record ID: 074/LNT/III/MEMBER/BNCC/MLG/XXXVI/08.2025 • Issued by Bina Nusantara Computer Club (BNCC) & BINUS University
  </div>
</body>
</html>
